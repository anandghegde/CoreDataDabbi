name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The canary leg reports; it does not gate. A red canary means an OS changed something Appendix A of
    # ARCHITECTURE.md relies on, which is a bug to file, not a reason to block an unrelated pull request.
    continue-on-error: ${{ matrix.canary }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            xcode: "26.4"
            canary: false
          - os: macos-15
            xcode: "26.3"
            canary: true
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          swift --version

      # Core Data writes the fixtures, so what is on disk depends on the OS build as well as on the generator.
      - name: Describe the image
        id: image
        run: |
          echo "os=$(sw_vers -buildVersion)" >> "$GITHUB_OUTPUT"
          echo "swift=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: .build
          key: build-${{ matrix.os }}-${{ steps.image.outputs.swift }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.os }}-${{ steps.image.outputs.swift }}-${{ hashFiles('Package.resolved') }}-

      - name: Cache the fixture zoo
        uses: actions/cache@v4
        with:
          path: Fixtures
          key: fixtures-${{ steps.image.outputs.os }}-${{ hashFiles('Tools/**', 'Package.resolved') }}

      - name: Build
        run: swift build --build-tests

      # The tests build their own fixtures, so they also prove that the generator works on this image.
      - name: Test
        run: swift test --skip-build

      - name: Load every fixture headlessly
        run: Scripts/smoke.sh

  app:
    name: App (macOS 26)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The app is built with Xcode, not SwiftPM: it needs a bundle, an Info.plist and a test host (ADR-06).
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: .build/xcode
          key: app-macos-26-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            app-macos-26-${{ hashFiles('Package.resolved') }}-

      # The app's tests write their own fixtures into a temporary folder, so there is nothing to cache for
      # them. They do put windows on screen, which needs the runner's login session — xcodebuild has one.
      - name: Test
        env:
          TEST_RUNNER_DABBI_SNAPSHOT_DIR: ${{ runner.temp }}/snapshots
        run: Scripts/app.sh test

      # Every user-visible string belongs in the String Catalog (§11). Xcode fills it on each build from the
      # IDE; a pull request written from the command line would otherwise leave it behind.
      - name: String Catalog is up to date
        run: Scripts/app.sh strings --check

      # What the windows looked like on this OS, for a reviewer who cannot run it. Nothing is compared against
      # them; they are there to be looked at.
      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore

  e2e:
    name: End to end (iOS simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The writer app is built with Xcode, for the simulator SDK that `swift test` on its own has no way to
      # reach (M2-11).
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: .build
          key: e2e-macos-26-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            e2e-macos-26-${{ hashFiles('Package.resolved') }}-

      # Booting takes the best part of a minute on a runner, and a device that is still booting when the first
      # install arrives fails it. The script waits, but doing it here means the wait is a step of its own in
      # the log rather than a mysteriously slow test.
      - name: Boot a simulator
        run: echo "DABBI_WRITER_UDID=$(Scripts/e2e.sh device)" >> "$GITHUB_ENV"

      # An app saves in the simulator; the tracker says so here. This is the M2 exit criterion.
      - name: Track a real app
        run: Scripts/e2e.sh run

      # What the device had to say for itself, for a failure that cannot be reproduced on a desk.
      - name: Keep the simulator log
        if: failure()
        run: xcrun simctl spawn "$DABBI_WRITER_UDID" log collect --output "${{ runner.temp }}/simulator.logarchive" || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: simulator-log
          path: ${{ runner.temp }}/simulator.logarchive
          if-no-files-found: ignore

  lint:
    name: Lint and layering
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # swift-format's output changes between toolchains; lint with the one the code was formatted with.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Lint
        run: Scripts/lint.sh

      - name: Layering
        run: Scripts/check-layering.sh

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: Scripts/check-dco.sh "$BASE" "$HEAD"
